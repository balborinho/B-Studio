<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B-Studio — Balborinho Animation Production Manager</title><style>
:root{--bg:#f4f5f7;--card:#fff;--text:#20242a;--muted:#747b84;--line:#dfe3e8;--accent:#4f46e5;--todo:#eef1f4;--doing:#fff0bd;--done:#d8f3e3}*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 12px;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:#b42318}.app{display:flex;min-height:100vh}.side{width:235px;background:#20242a;color:#fff;padding:18px;min-height:100vh;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;margin-bottom:3px}.brand img{width:30px;height:30px;object-fit:contain}.brand-sub{font-size:11px;line-height:1.3;color:#aeb4bc;margin:0 0 22px 39px}.side-footer{margin-top:auto;padding-top:25px;color:#8f969f;font-size:11px;text-align:center}.nav{padding:9px;border-radius:7px;color:#ddd;cursor:pointer}.nav.active,.nav:hover{background:#30353d;color:#fff}.side button{width:100%;margin-top:9px}.main{flex:1;min-width:0}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.top h1{font-size:19px;margin:0}.content{padding:22px;max-width:1600px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 2px 9px #0000000b}.card h3{margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.progress{height:7px;background:#e7e9ed;border-radius:9px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--accent)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat b{font-size:25px;display:block}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}.tablewrap{overflow:auto;max-height:calc(100vh - 220px);background:#fff;border:1px solid var(--line);border-radius:10px}.prod{border-collapse:separate;border-spacing:0;min-width:max-content;width:100%}.prod th,.prod td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}.prod th{background:#f7f8fa;padding:8px 6px;font-size:11px;position:sticky;top:0;z-index:3;max-width:88px}.prod th:first-child,.prod td:first-child{position:sticky;left:0;z-index:4;background:#fff}.prod th:first-child{background:#f7f8fa;text-align:left}.shot{width:320px;min-width:320px;padding:10px!important}.shot strong{display:block}.shot small{color:var(--muted);display:block;max-width:285px;line-height:1.35}.status{width:58px;height:32px;margin:8px auto;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;cursor:pointer;border-radius:6px}.task-cell{text-align:center;min-width:78px}.assignee{display:block;border:0;background:transparent;color:var(--muted);padding:1px 3px;margin:0 auto;font-size:10px;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.assign-empty{position:absolute;opacity:0;pointer-events:none}.task-cell{position:relative}.task-cell:hover .assign-empty,.task-cell:focus-within .assign-empty{opacity:1;pointer-events:auto}.assign-empty{border:0;background:transparent;color:var(--muted);font-size:13px;padding:0;right:3px;bottom:2px;cursor:pointer}.assignee:hover{color:var(--text)}.na{background:#f7f8fa;color:#9aa1aa}.todo{background:var(--todo);color:#69727d}.doing{background:var(--doing);color:#805900}.done{background:var(--done);color:#17643a}.actions{display:flex;gap:5px;margin-top:8px}.empty{text-align:center;padding:55px;color:var(--muted)}.user-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.user-row:last-child{border-bottom:0}.user-actions{display:flex;gap:6px}.modal-bg{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px;z-index:50}.modal-bg.open{display:flex}.modal{background:#fff;border-radius:11px;width:min(560px,100%);max-height:90vh;overflow:auto}.mh,.mf{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.mf{border-top:1px solid var(--line);border-bottom:0;gap:8px}.mb{padding:18px}.field{margin-bottom:14px}.field label{display:block;font-weight:700;font-size:12px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px}.task{display:flex;gap:6px;margin:6px 0}.task input{flex:1}.pill{display:inline-block;background:#eef0f2;border-radius:20px;padding:3px 8px;font-size:11px;margin:10px 4px 0 0}@media(max-width:700px){.side{display:none}.stats{grid-template-columns:1fr 1fr}.content{padding:12px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><img src="logo-bbr.svg" alt="B-Studio logo" onerror="this.style.display='none'"><span>B-Studio</span></div><div class="brand-sub">Balborinho Animation Production Manager</div><div id="navProjects" class="nav active" onclick="projects()">Projects</div><div id="navTemplates" class="nav" onclick="templates()">Templates</div><div id="navUsers" class="nav" onclick="users()">Users</div><hr><button onclick="exportDB()">Export JSON</button><button onclick="document.getElementById('imp').click()">Import JSON</button><input id="imp" type="file" accept=".json" hidden onchange="importDB(event)"><div class="side-footer">Baborinho 2026</div></aside><main class="main"><header class="top"><h1 id="title">Projects</h1><div id="actions"></div></header><section id="content" class="content"></section></main></div><div id="modal" class="modal-bg"><div class="modal"><div class="mh"><b id="mtitle"></b><button onclick="closeModal()">×</button></div><div id="mbody" class="mb"></div><div id="mfoot" class="mf"></div></div></div>
<script>
const K='animation-production-manager';const DEFAULT_TEMPLATES=[{name:'2D Animation',description:'Pipeline for 2D animation',tasks:['Script','Design','Storyboard','Audio Pre','Animatic','Layout','Animation','Polish','VFX','Render','Compositing','Audio Post','Editing']},{name:'3D Animation',description:'Pipeline for 3D animation',tasks:['Script','Design','Storyboard','Audio Pre','Animatic','Layout','Modelling','Shading','Rigging','Animation','Polish','VFX','Lighting','Render','Compositing','Audio Post','Editing']}];let db=JSON.parse(localStorage.getItem(K)||'null')||{templates:DEFAULT_TEMPLATES.map(t=>({id:id(),...t})),projects:[],users:[]};db.users=db.users||[];let pid=null,saveFn=null;
function id(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function save(){localStorage.setItem(K,JSON.stringify(db))}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function nav(n){navProjects.classList.toggle('active',n==='p');navTemplates.classList.toggle('active',n==='t')}
function nav(n){navProjects.classList.toggle('active',n==='p');navTemplates.classList.toggle('active',n==='t');navUsers.classList.toggle('active',n==='u')}
function normalizeTask(t){if(!t.status)t.status='na';if(t.assigneeId===undefined)t.assigneeId=null;return t}
function projects(){pid=null;nav('p');title.textContent='Projects';actions.innerHTML='<button class="primary" onclick="newProject()">+ New project</button>';content.innerHTML=db.projects.length?'<div class="grid">'+db.projects.map(p=>{let total=p.shots.reduce((a,s)=>a+s.tasks.filter(t=>t.status!=='na').length,0),done=p.shots.reduce((a,s)=>a+s.tasks.filter(t=>t.status==='done').length,0),pc=total?Math.round(done/total*100):0,t=db.templates.find(x=>x.id===p.templateId);return `<div class="card" style="cursor:pointer" onclick="openProject('${p.id}')"><h3>${esc(p.name)}</h3><span class="muted">${esc(t?.name||'Template removed')}</span><p class="muted">${esc(p.description||'')}</p><div class="progress"><i style="width:${pc}%"></i></div><span class="pill">${p.shots.length} shots</span><span class="pill">${pc}%</span></div>`}).join('')+'</div>':'<div class="card empty"><h2>No projects</h2><p>Create a project to start.</p><button class="primary" onclick="newProject()">Create project</button></div>'}
function templates(){pid=null;nav('t');title.textContent='Templates';actions.innerHTML='<button class="primary" onclick="newTemplate()">+ New template</button>';content.innerHTML='<div class="grid">'+(db.templates.length?db.templates.map(t=>`<div class="card"><h3>${esc(t.name)}</h3><p class="muted">${esc(t.description||'')}</p><ol>${t.tasks.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><button onclick="editTemplate('${t.id}')">Edit</button> <button class="danger" onclick="delTemplate('${t.id}')">Delete</button></div>`).join(''):'<div class="card empty">No templates.</div>')+'</div>'}
function users(){pid=null;nav('u');title.textContent='Users';actions.innerHTML='<button class="primary" onclick="newUser()">+ New user</button>';content.innerHTML='<div class="card">'+(db.users.length?db.users.map(u=>`<div class="user-row"><strong>${esc(u.name)}</strong><div class="user-actions"><button onclick="editUser('${u.id}')">Edit</button><button class="danger" onclick="delUser('${u.id}')">Delete</button></div></div>`).join(''):'<div class="empty"><h2>No users</h2><p>Add users to assign production tasks.</p></div>')+'</div>'}
function openProject(id){pid=id;nav('p');let p=db.projects.find(x=>x.id===id),t=db.templates.find(x=>x.id===p.templateId);title.textContent=p.name;actions.innerHTML=`<button onclick="editProject('${id}')">Settings</button><button class="primary" onclick="newShot('${id}')">+ New shot</button>`;p.shots.forEach(s=>s.tasks.forEach(normalizeTask));let total=p.shots.reduce((a,s)=>a+s.tasks.filter(x=>x.status!=='na').length,0),todo=p.shots.reduce((a,s)=>a+s.tasks.filter(x=>x.status==='todo').length,0),doing=p.shots.reduce((a,s)=>a+s.tasks.filter(x=>x.status==='doing').length,0),done=p.shots.reduce((a,s)=>a+s.tasks.filter(x=>x.status==='done').length,0),pc=total?Math.round(done/total*100):0;let stats=`<div class="stats"><div class="card stat"><small>SHOTS</small><b>${p.shots.length}</b></div><div class="card stat"><small>TO DO</small><b>${todo}</b></div><div class="card stat"><small>DOING</small><b>${doing}</b></div><div class="card stat"><small>DONE</small><b>${done}/${total}</b><div class="progress"><i style="width:${pc}%"></i></div></div></div>`;if(!t){content.innerHTML=stats+'<div class="card empty">Template missing. Edit project settings.</div>';return}let rows=p.shots.map(s=>`<tr><td class="shot"><strong>${esc(s.code)}</strong><small>${esc(s.description||'')}</small><div class="actions"><button onclick="moveShot('${s.id}',-1)" title="Move shot up">↑</button><button onclick="moveShot('${s.id}',1)" title="Move shot down">↓</button><button onclick="editShot('${s.id}')">Edit</button><button class="danger" onclick="delShot('${s.id}')">Delete</button></div></td>${s.tasks.map(x=>{let u=db.users.find(a=>a.id===x.assigneeId);return `<td><div class="task-cell"><div class="status ${x.status}" onclick="cycle('${s.id}','${x.id}')">${x.status.toUpperCase()}</div>${u?`<button class="assignee" onclick="event.stopPropagation();assignTask('${s.id}','${x.id}')" title="Change assignee">${esc(u.name)}</button>`:`<button class="assign-empty" onclick="event.stopPropagation();assignTask('${s.id}','${x.id}')" title="Assign user">+</button>`}</div></td>`}).join('')}</tr>`).join('');content.innerHTML=stats+`<div class="toolbar"><span class="muted">${esc(p.description||'')} · ${esc(t.name)}</span></div><div class="tablewrap"><table class="prod"><thead><tr><th>Shot</th>${t.tasks.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${t.tasks.length+1}"><div class="empty">No shots yet.</div></td></tr>`}</tbody></table></div>`;save()}
function cycle(sid,tid){let p=db.projects.find(x=>x.id===pid),s=p.shots.find(x=>x.id===sid),t=s.tasks.find(x=>x.id===tid);t.status={na:'todo',todo:'doing',doing:'done',done:'na'}[t.status]||'na';save();openProject(pid)}
function assignTask(sid,tid){let p=db.projects.find(x=>x.id===pid),s=p.shots.find(x=>x.id===sid),t=s.tasks.find(x=>x.id===tid);form('Assign task',`<div class="field"><label>Assignee</label><select id="assignee"><option value="">Unassigned</option>${db.users.map(u=>`<option value="${u.id}" ${u.id===t.assigneeId?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>`,()=>{t.assigneeId=document.getElementById('assignee').value||null;save();closeModal();openProject(pid)})}
function form(titleText,body,fn,del){mtitle.textContent=titleText;mbody.innerHTML=body;saveFn=fn;mfoot.innerHTML=(del?'<button class="danger" onclick="saveFn.del()">Delete</button>':'')+'<span style="flex:1"></span><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveFn()">Save</button>';modal.classList.add('open')}
function closeModal(){modal.classList.remove('open');saveFn=null}
function newProject(){form('New project',`<div class="field"><label>Name</label><input id="name" autofocus></div><div class="field"><label>Description</label><textarea id="desc"></textarea></div><div class="field"><label>Template</label><select id="tpl">${db.templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>`,()=>{const n=document.getElementById('name'),d=document.getElementById('desc'),t=document.getElementById('tpl');let p={id:id(),name:n.value.trim(),description:d.value.trim(),templateId:t.value,shots:[]};if(!p.name)return alert('Name is required.');db.projects.push(p);save();closeModal();openProject(p.id)})}
function editProject(x){let p=db.projects.find(a=>a.id===x);form('Project settings',`<div class="field"><label>Name</label><input id="projectName" value="${esc(p.name)}"></div><div class="field"><label>Description</label><textarea id="projectDesc">${esc(p.description||'')}</textarea></div><div class="field"><label>Template</label><select id="projectTpl">${db.templates.map(t=>`<option value="${t.id}" ${t.id===p.templateId?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>`,()=>{const nameEl=document.getElementById('projectName'),descEl=document.getElementById('projectDesc'),tplEl=document.getElementById('projectTpl');p.name=nameEl.value.trim()||p.name;p.description=descEl.value.trim();p.templateId=tplEl.value;save();closeModal();openProject(x)},()=>{if(confirm('Delete project?')){db.projects=db.projects.filter(a=>a.id!==x);save();closeModal();projects()}})}
function newShot(x){let p=db.projects.find(a=>a.id===x),n=String(p.shots.length+1).padStart(3,'0');while(p.shots.some(s=>s.code===n))n=String(+n+1).padStart(3,'0');form('New shot',`<div class="field"><label>Shot</label><input id="code" value="${n}"></div><div class="field"><label>Description</label><input id="desc"></div>`,()=>{let t=db.templates.find(a=>a.id===p.templateId);if(!t)return alert('Template missing.');p.shots.push({id:id(),code:document.getElementById('code').value.trim()||n,description:document.getElementById('desc').value.trim(),tasks:t.tasks.map(name=>({id:id(),name,status:'na',assigneeId:null}))});save();closeModal();openProject(x)})}
function editShot(x){let p=db.projects.find(a=>a.id===pid),s=p.shots.find(a=>a.id===x);form('Edit shot',`<div class="field"><label>Shot</label><input id="code" value="${esc(s.code)}"></div><div class="field"><label>Description</label><input id="desc" value="${esc(s.description||'')}"></div>`,()=>{s.code=document.getElementById('code').value.trim()||s.code;s.description=document.getElementById('desc').value.trim();save();closeModal();openProject(pid)})}
function delShot(x){if(confirm('Delete shot?')){let p=db.projects.find(a=>a.id===pid);p.shots=p.shots.filter(s=>s.id!==x);save();openProject(pid)}}
function moveShot(x,d){let p=db.projects.find(a=>a.id===pid);let i=p.shots.findIndex(s=>s.id===x),j=i+d;if(i<0||j<0||j>=p.shots.length)return;[p.shots[i],p.shots[j]]=[p.shots[j],p.shots[i]];save();openProject(pid)}
function newUser(){form('New user',`<div class="field"><label>Name</label><input id="userName" autofocus></div>`,()=>{let n=document.getElementById('userName').value.trim();if(!n)return alert('Name is required.');db.users.push({id:id(),name:n});save();closeModal();users()})}
function editUser(x){let u=db.users.find(a=>a.id===x);form('Edit user',`<div class="field"><label>Name</label><input id="userName" value="${esc(u.name)}"></div>`,()=>{let n=document.getElementById('userName').value.trim();if(!n)return alert('Name is required.');u.name=n;save();closeModal();users()})}
function delUser(x){if(confirm('Delete user? Existing task assignments will be cleared.')){db.projects.forEach(p=>p.shots.forEach(s=>s.tasks.forEach(t=>{if(t.assigneeId===x)t.assigneeId=null})));db.users=db.users.filter(u=>u.id!==x);save();users()}}
function addTask(){const c=document.getElementById('tasks');const i=c.children.length;c.insertAdjacentHTML('beforeend',`<div class="task"><input placeholder="Task ${i+1}"><button type="button" onclick="this.parentNode.remove()">×</button></div>`);c.lastElementChild.querySelector('input').focus()}
function taskFields(tasks){return `<div id="tasks">${tasks.map((x,i)=>`<div class="task"><input value="${esc(x)}" placeholder="Task ${i+1}"><button type="button" onclick="this.parentNode.remove()">×</button></div>`).join('')}</div><button type="button" onclick="addTask()">+ Add task</button>`}
function newTemplate(){form('New template',`<div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Description</label><textarea id="desc"></textarea></div><div class="field"><label>Tasks</label>${taskFields(['Guião','Storyboard'])}</div>`,()=>{const nameEl=document.getElementById('name');const descEl=document.getElementById('desc');let ts=[...document.querySelectorAll('#tasks input')].map(x=>x.value.trim()).filter(Boolean);if(!nameEl.value.trim()||!ts.length)return alert('Name and at least one task are required.');db.templates.push({id:id(),name:nameEl.value.trim(),description:descEl.value.trim(),tasks:ts});save();closeModal();templates()})}
function editTemplate(x){let t=db.templates.find(a=>a.id===x);form('Edit template',`<div class="field"><label>Name</label><input id="name" value="${esc(t.name)}"></div><div class="field"><label>Description</label><textarea id="desc">${esc(t.description||'')}</textarea></div><div class="field"><label>Tasks</label>${taskFields(t.tasks)}</div>`,()=>{const nameEl=document.getElementById('name');const descEl=document.getElementById('desc');let ts=[...document.querySelectorAll('#tasks input')].map(x=>x.value.trim()).filter(Boolean);if(!ts.length)return alert('At least one task is required.');t.name=nameEl.value.trim()||t.name;t.description=descEl.value.trim();t.tasks=ts;save();closeModal();templates()})}
function delTemplate(x){if(db.projects.some(p=>p.templateId===x))return alert('This template is used by a project.');if(confirm('Delete template?')){db.templates=db.templates.filter(t=>t.id!==x);save();templates()}}
function exportDB(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='animation-production-data.json';a.click()}
function importDB(e){let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.templates||!x.projects)throw 0;if(confirm('Replace current data?')){db=x;save();projects()}}catch{alert('Invalid JSON')}};r.readAsText(e.target.files[0])}
(function init(){let changed=false;if(!db.users){db.users=[];changed=true}if(!db.templates||!db.templates.length){db.templates=DEFAULT_TEMPLATES.map(t=>({id:id(),...t}));changed=true}else{DEFAULT_TEMPLATES.forEach(d=>{let t=db.templates.find(x=>x.name===d.name||x.description===d.description);if(t&&(t.name!==d.name||t.description!==d.description||JSON.stringify(t.tasks)!==JSON.stringify(d.tasks))){t.name=d.name;t.description=d.description;t.tasks=d.tasks.slice();changed=true}})}db.projects.forEach(p=>p.shots.forEach(s=>s.tasks.forEach(t=>{if(!t.status){t.status='na';changed=true}if(t.assigneeId===undefined){t.assigneeId=null;changed=true}})));if(changed)save();projects()})();
</script></body></html>
